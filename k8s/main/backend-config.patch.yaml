apiVersion: v1
kind: ConfigMap
metadata:
  name: biatec-chat-backend
data:
  Oidc__Issuer: https://oidc.biatec.io
  Oidc__McpResource: https://mcp.biatec.io/tools
  Mcp__Endpoint: https://mcp.biatec.io/tools
  Algod__Networks__mainnet__Url: https://mainnet-api.4160.nodely.dev
  Algod__Networks__testnet__Url: https://testnet-api.4160.nodely.dev
  # X-Forwarded-For is trusted only from these peers (ingress-nginx runs in-cluster). RFC 1918 covers the pod and node ranges; narrow
  # to the ingress pod CIDR when it is known. Without it every visitor shares the ingress pod's address (BCHAT-005).
  ForwardedHeaders__KnownNetworks__0: 10.0.0.0/8
  ForwardedHeaders__KnownNetworks__1: 172.16.0.0/12
  ForwardedHeaders__KnownNetworks__2: 192.168.0.0/16
