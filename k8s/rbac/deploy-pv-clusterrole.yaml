# The one cluster-scope right of the STAGE deploy identity: the fixed hostPath volumes of k8s/stage/storage.yaml (the cluster has no
# dynamic provisioner). Production has no volumes yet; give it its own copy with its volume names when it gets a storage.yaml.
# `create` cannot be limited by name, so a volume can be created but only the named ones can be read or changed afterwards;
# There is no `list`: the deploy's `kubectl get pv` diagnostic is best effort and fails harmlessly. A hostPath volume can expose node
# paths to whoever can also change a workload, so this identity is trusted only as far as its branch policy and reviewers (docs/cicd.md).
# Bind it with a ClusterRoleBinding to the same service account:
#   kubectl create clusterrolebinding biatec-chat-stage-deploy-pv --clusterrole=biatec-chat-stage-deploy-pv --serviceaccount=<ns>:<sa>
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: biatec-chat-stage-deploy-pv
  labels:
    app.kubernetes.io/part-of: biatec-chat
rules:
  - apiGroups: [""]
    resources: ["persistentvolumes"]
    verbs: ["create"]
  - apiGroups: [""]
    resources: ["persistentvolumes"]
    resourceNames: ["biatec-chat-stage-postgres", "biatec-chat-stage-redis"]
    verbs: ["get", "patch"]
