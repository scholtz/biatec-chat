# Reusable deploy of already-pushed images to one Kubernetes environment. Called by deploy-stage.yml (Stage, k8s/stage)
# and promote-production.yml (Production, k8s/main); it never builds anything. Credentials come only from the GitHub
# environment's secrets (KUBE_CONFIG, OIDC_CLIENT_ID, OIDC_CLIENT_SECRET,AWS_ROLE_ARN, AWS_TRUST_ANCHOR_ARN, AWS_PROFILE_ARN, AWS_CLIENT_CERT, AWS_CLIENT_KEY); see docs/cicd.md.
name: deploy

on:
  workflow_call:
    inputs:
      environment: {type: string, required: true, description: "GitHub environment: Stage or Production"}
      url: {type: string, required: true}
      overlay: {type: string, required: true, description: "k8s/<overlay>: stage or main"}
      namespace: {type: string, required: true}
      tag: {type: string, required: true, description: "Image tag of all images in the overlay, already in the registry"}

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: ${{ inputs.environment }}
      url: ${{ inputs.url }}
    env:
      NAMESPACE: ${{ inputs.namespace }}
      OVERLAY: k8s/${{ inputs.overlay }}
      TAG: ${{ inputs.tag }}
    steps:
      - uses: actions/checkout@v4

      - uses: azure/setup-kubectl@v4

      - name: Configure kubeconfig
        env:
          KUBE_CONFIG: ${{ secrets.KUBE_CONFIG }}
        run: |
          if [ -z "$KUBE_CONFIG" ]; then echo "::error::KUBE_CONFIG is not set on the ${{ inputs.environment }} environment."; exit 1; fi
          mkdir -p "$HOME/.kube"
          echo "$KUBE_CONFIG" | base64 -d > "$HOME/.kube/config"
          chmod 600 "$HOME/.kube/config"

      # Postgres, Redis and builders passwords and the token-vault and evidence master keys come from the environment's
      # GitHub secrets (docs/cicd.md has the one-liners that generate them). Postgres only reads its password when its
      # volume is first initialised, so never change POSTGRES_PASSWORD afterwards; losing VAULT_MASTER_KEY signs every
      # user out, and changing EVIDENCE_MASTER_KEY changes the evidence signing keys.
      - name: Sync biatec-chat-generated
        env:
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          REDIS_PASSWORD: ${{ secrets.REDIS_PASSWORD }}
          BUILDERS_INTERNAL_SECRET: ${{ secrets.BUILDERS_INTERNAL_SECRET }}
          VAULT_MASTER_KEY: ${{ secrets.VAULT_MASTER_KEY }}
          EVIDENCE_MASTER_KEY: ${{ secrets.EVIDENCE_MASTER_KEY }}
        run: |
          for v in POSTGRES_PASSWORD REDIS_PASSWORD BUILDERS_INTERNAL_SECRET VAULT_MASTER_KEY EVIDENCE_MASTER_KEY; do
            if [ -z "${!v}" ]; then echo "::error::$v is not set on the ${{ inputs.environment }} environment (docs/cicd.md)."; exit 1; fi
          done
          # The vault key is base64 of 32 bytes (Vault:MasterKey).
          [ "$(printf '%s' "$VAULT_MASTER_KEY" | base64 -d 2>/dev/null | wc -c)" = 32 ] \
            || { echo "::error::VAULT_MASTER_KEY must be base64 of 32 bytes (openssl rand -base64 32)."; exit 1; }
          # The evidence key is base64 of at least 32 bytes (Evidence:Secret:MasterKey).
          [ "$(printf '%s' "$EVIDENCE_MASTER_KEY" | base64 -d 2>/dev/null | wc -c)" -ge 32 ] \
            || { echo "::error::EVIDENCE_MASTER_KEY must be base64 of at least 32 bytes (openssl rand -base64 32)."; exit 1; }
          kubectl create secret generic biatec-chat-generated -n "$NAMESPACE" \
            --from-literal=postgres-password="$POSTGRES_PASSWORD" \
            --from-literal=redis-password="$REDIS_PASSWORD" \
            --from-literal=builders-internal-secret="$BUILDERS_INTERNAL_SECRET" \
            --from-literal=vault-master-key="$VAULT_MASTER_KEY" \
            --from-literal=evidence-master-key="$EVIDENCE_MASTER_KEY" \
            --dry-run=client -o yaml | kubectl apply -f -

      # The tenant's Biatec OIDC client secret, from the environment's GitHub secrets.
      - name: Sync biatec-chat-secrets
        env:
          OIDC_CLIENT_SECRET: ${{ secrets.OIDC_CLIENT_SECRET }}
        run: |
          if [ -z "$OIDC_CLIENT_SECRET" ]; then echo "::error::OIDC_CLIENT_SECRET is not set on the ${{ inputs.environment }} environment (docs/cicd.md)."; exit 1; fi
          kubectl create secret generic biatec-chat-secrets -n "$NAMESPACE" \
            --from-literal=oidc-client-secret="$OIDC_CLIENT_SECRET" \
            --dry-run=client -o yaml | kubectl apply -f -

      # Bedrock access through IAM Roles Anywhere (docs/aws-setup.md): the environment's client certificate and key, and
      # the config file the AWS SDK reads (credential_process runs the aws_signing_helper in the backend image).
      - name: Sync biatec-chat-aws
        env:
          AWS_ROLE_ARN: ${{ secrets.AWS_ROLE_ARN }}
          AWS_TRUST_ANCHOR_ARN: ${{ secrets.AWS_TRUST_ANCHOR_ARN }}
          AWS_PROFILE_ARN: ${{ secrets.AWS_PROFILE_ARN }}
          AWS_CLIENT_CERT: ${{ secrets.AWS_CLIENT_CERT }}
          AWS_CLIENT_KEY: ${{ secrets.AWS_CLIENT_KEY }}
        run: |
          for v in AWS_ROLE_ARN AWS_TRUST_ANCHOR_ARN AWS_PROFILE_ARN AWS_CLIENT_CERT AWS_CLIENT_KEY; do
            if [ -z "${!v}" ]; then echo "::error::$v is missing (see docs/aws-setup.md)."; exit 1; fi
          done
          # The client certificate must match the key, or the SDK would fail only at the first chat message.
          cert_pub="$(printf '%s\n' "$AWS_CLIENT_CERT" | openssl x509 -pubkey -noout)"
          key_pub="$(printf '%s\n' "$AWS_CLIENT_KEY" | openssl pkey -pubout)"
          [ "$cert_pub" = "$key_pub" ] || { echo "::error::AWS_CLIENT_CERT and AWS_CLIENT_KEY do not match."; exit 1; }
          printf '%s\n' "$AWS_CLIENT_CERT" | openssl x509 -noout -checkend 1209600 \
            || echo "::warning::The AWS client certificate expires within 14 days; renew it (docs/aws-setup.md, RENEW=1)."
          d=/var/run/secrets/aws-rolesanywhere
          cat > "$RUNNER_TEMP/aws-config" <<CONFIG
          [default]
          region = eu-central-1
          credential_process = /usr/local/bin/aws_signing_helper credential-process --certificate $d/certificate.pem --private-key $d/private-key.pem --trust-anchor-arn $AWS_TRUST_ANCHOR_ARN --profile-arn $AWS_PROFILE_ARN --role-arn $AWS_ROLE_ARN --region eu-central-1
          CONFIG
          kubectl create secret generic biatec-chat-aws -n "$NAMESPACE" \
            --from-file=config="$RUNNER_TEMP/aws-config" \
            --from-literal=certificate.pem="$AWS_CLIENT_CERT" \
            --from-literal=private-key.pem="$AWS_CLIENT_KEY" \
            --dry-run=client -o yaml | kubectl apply -f -
          rm -f "$RUNNER_TEMP/aws-config"

      # Every image of the overlay carries the same tag; pin it in the overlay (not committed) and apply.
      # The demo site (apps/demo) is in the overlay when it renders an Ingress named biatec-chat-demo (k8s/stage); its
      # host is what the tenant step registers and the rollout step waits on. k8s/main deletes it, so production skips both.
      - name: Apply ${{ inputs.overlay }} with tag ${{ inputs.tag }}
        id: apply
        run: |
          sed -i "s/^\(\s*newTag:\).*/\1 $TAG/" "$OVERLAY/kustomization.yaml"
          total="$(grep -c "newTag:" "$OVERLAY/kustomization.yaml")"
          [ "$total" -ge 2 ] && [ "$(grep -c "newTag: $TAG$" "$OVERLAY/kustomization.yaml")" = "$total" ]
          kubectl kustomize "$OVERLAY" > "$RUNNER_TEMP/rendered.yaml"
          demo_host="$(yq -r 'select(.kind == "Ingress" and .metadata.name == "biatec-chat-demo") | .spec.rules[0].host' "$RUNNER_TEMP/rendered.yaml")"
          echo "demo_host=$demo_host" >> "$GITHUB_OUTPUT"
          kubectl apply -f "$RUNNER_TEMP/rendered.yaml"

      - name: Wait for databases
        run: |
          kubectl rollout status statefulset/biatec-chat-postgres -n "$NAMESPACE" --timeout=5m
          kubectl rollout status statefulset/biatec-chat-redis -n "$NAMESPACE" --timeout=5m

      # Why a database did not come up (claim not bound, volume permissions, crash loop), in the job log.
      - name: Database diagnostics
        if: failure()
        continue-on-error: true
        run: |
          kubectl get pods,pvc -n "$NAMESPACE" -o wide || true
          kubectl get pv -o wide | grep -E "NAME|chat" || true
          for p in biatec-chat-postgres-0 biatec-chat-redis-0; do
            echo "=== $p"
            kubectl describe pod "$p" -n "$NAMESPACE" | sed -n '/^Events:/,$p;/^Status:/p;/Reason:/p;/Exit Code:/p' || true
            kubectl logs "$p" -n "$NAMESPACE" --tail=30 || true
            kubectl logs "$p" -n "$NAMESPACE" --previous --tail=30 || true
          done
          kubectl get events -n "$NAMESPACE" --sort-by=.lastTimestamp | tail -15 || true

      # The backend migrates only in Development; elsewhere the schema is a deploy step. The idempotent script applies
      # just the migrations missing from __EFMigrationsHistory, so it is safe on every deploy.
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Migrate database
        run: |
          dotnet tool restore
          dotnet ef migrations script --idempotent --project backend/Biatec.Chat.Api --output migrate.sql
          sed -i '1s/^\xEF\xBB\xBF//' migrate.sql
          kubectl exec -i statefulset/biatec-chat-postgres -n "$NAMESPACE" -- \
            psql -q -v ON_ERROR_STOP=1 -U biatec -d biatec_chat < migrate.sql

      # The backend resolves the tenant (host, OIDC client id, redirect URI) from the Tenants table and seeds it only in
      # Development. This creates the biatec-chat tenant for the environment's host from OIDC_CLIENT_ID, or updates just
      # those four columns on later deploys (everything else on the row is owned by onboarding and left alone). The
      # client secret itself stays a pointer (ClientSecretRef) to the biatec-chat-secrets key.
      - name: Seed tenant biatec-chat
        env:
          OIDC_CLIENT_ID: ${{ secrets.OIDC_CLIENT_ID }}
          SITE_URL: ${{ inputs.url }}
        run: |
          if [ -z "$OIDC_CLIENT_ID" ]; then echo "::error::OIDC_CLIENT_ID is not set on the ${{ inputs.environment }} environment (docs/cicd.md)."; exit 1; fi
          host="${SITE_URL#https://}"; host="${host%/}"
          kubectl exec -i statefulset/biatec-chat-postgres -n "$NAMESPACE" -- \
            psql -q -v ON_ERROR_STOP=1 -U biatec -d biatec_chat \
              -v host="$host" -v client_id="$OIDC_CLIENT_ID" -v redirect="https://$host/auth/callback" <<'SQL'
          INSERT INTO "Tenants" ("Id", "Host", "SignInPageUrl", "BedrockBudgets", "SafeApprovalCaps", "ConsentThresholdCeilingEur",
                                 "LimitsUpdateEnabled", "X402Enabled", "OidcClientId", "ClientSecretRef", "RedirectUri",
                                 "AllowedOrigins", "ClientKeys", "SoftCapEurPerHour", "TrustAnchorVerified", "Suggestions")
          VALUES ('biatec-chat', :'host', 'https://web.biatec.io', '{}', '{}', 1000, false, false, :'client_id',
                  'secret://biatec-chat/oidc-client-secret', :'redirect',
                  ARRAY['https://web.biatec.io', 'https://dex.biatec.io'], '["biatec-web","biatec-dex"]', 1500, true, '[]')
          ON CONFLICT ("Id") DO UPDATE SET "Host" = EXCLUDED."Host", "OidcClientId" = EXCLUDED."OidcClientId",
                                           "ClientSecretRef" = EXCLUDED."ClientSecretRef", "RedirectUri" = EXCLUDED."RedirectUri";
          SQL

      # The demo site (docs/demo-site.md) calls the backend from its own origin with client key biatec-demo. Adds just
      # that origin and key to the tenant when missing; everything else on the row stays owned by onboarding. Same limits
      # as onboarding (10 origins, 20 client keys, same site as the backend host: the session cookie is SameSite=Lax),
      # and the step fails unless the row afterwards holds both.
      - name: Register demo origin on tenant biatec-chat
        if: steps.apply.outputs.demo_host != ''
        env:
          DEMO_HOST: ${{ steps.apply.outputs.demo_host }}
          SITE_URL: ${{ inputs.url }}
        run: |
          [[ "$DEMO_HOST" =~ ^[a-z0-9.-]+$ ]] || { echo "::error::Unexpected demo ingress host '$DEMO_HOST'."; exit 1; }
          origin="https://$DEMO_HOST"
          site="${SITE_URL#https://}"; site="${site%/}"
          [[ "$DEMO_HOST" == *."${site#*.}" ]] || { echo "::error::$origin is not under ${site#*.} (same site as $site)."; exit 1; }
          ok="$(kubectl exec -i statefulset/biatec-chat-postgres -n "$NAMESPACE" -- \
            psql -qtA -v ON_ERROR_STOP=1 -U biatec -d biatec_chat -v origin="$origin" -v client_key=biatec-demo <<'SQL'
          UPDATE "Tenants" SET "AllowedOrigins" = array_append(COALESCE("AllowedOrigins", '{}'), :'origin')
           WHERE "Id" = 'biatec-chat' AND NOT (:'origin' = ANY (COALESCE("AllowedOrigins", '{}')))
             AND cardinality(COALESCE("AllowedOrigins", '{}')) < 10;
          UPDATE "Tenants" SET "ClientKeys" = COALESCE("ClientKeys", '[]'::jsonb) || jsonb_build_array(:'client_key'::text)
           WHERE "Id" = 'biatec-chat' AND NOT (COALESCE("ClientKeys", '[]'::jsonb) @> jsonb_build_array(:'client_key'::text))
             AND jsonb_array_length(COALESCE("ClientKeys", '[]'::jsonb)) < 20;
          SELECT (:'origin' = ANY (COALESCE("AllowedOrigins", '{}')))
                 AND COALESCE("ClientKeys", '[]'::jsonb) @> jsonb_build_array(:'client_key'::text)
            FROM "Tenants" WHERE "Id" = 'biatec-chat';
          SQL
          )"
          [ "$ok" = t ] || { echo "::error::Tenant biatec-chat is missing, or already has 10 origins / 20 client keys: $origin and biatec-demo were not registered (got '$ok')."; exit 1; }
          echo "Tenant biatec-chat allows $origin with client key biatec-demo."

      - name: Wait for rollout
        env:
          DEMO_HOST: ${{ steps.apply.outputs.demo_host }}
        run: |
          kubectl rollout status deployment/biatec-chat-builders -n "$NAMESPACE" --timeout=5m
          kubectl rollout status deployment/biatec-chat-backend -n "$NAMESPACE" --timeout=5m
          if [ -n "$DEMO_HOST" ]; then kubectl rollout status deployment/biatec-chat-demo -n "$NAMESPACE" --timeout=5m; fi

      - name: Summary
        run: echo "Deployed \`$TAG\` to ${{ inputs.environment }} (\`$NAMESPACE\`)." >> "$GITHUB_STEP_SUMMARY"

      - name: Remove kubeconfig
        if: always()
        run: rm -f "$HOME/.kube/config"
