apiVersion: v1
kind: ConfigMap
metadata:
  name: biatec-chat-backend
data:
  Oidc__Issuer: https://stage.oidc.biatec.io
  Oidc__McpResource: https://stage.mcp.biatec.io/tools
  Mcp__Endpoint: https://stage.mcp.biatec.io/tools
  Algod__Networks__mainnet__Url: https://mainnet-api.4160.nodely.dev
  Algod__Networks__testnet__Url: https://testnet-api.4160.nodely.dev
  # Biatec DEX beta serves this backend at https://beta.dex.biatec.io/chat (its ingress forwards the full path, prefix
  # included). Needs a tenant for that host, which the deploy provisions from these keys (docs/cicd.md, "Mounted hosts").
  Hosting__Mounts__0__Host: beta.dex.biatec.io
  Hosting__Mounts__0__Prefix: /chat
  Hosting__Mounts__0__ClientKey: biatec-dex
