# Static server for the demo site. Runs as the unprivileged nginx user on 8080 with a read-only root filesystem: every
# runtime path (pid, temp files) is under /tmp, an emptyDir in k8s/base/demo.yaml. The headers, CSP included, are in
# security-headers.conf.
worker_processes 1;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events {
  worker_connections 512;
}

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  access_log /dev/stdout;
  sendfile on;
  server_tokens off;

  client_body_temp_path /tmp/client_temp;
  proxy_temp_path /tmp/proxy_temp;
  fastcgi_temp_path /tmp/fastcgi_temp;
  uwsgi_temp_path /tmp/uwsgi_temp;
  scgi_temp_path /tmp/scgi_temp;

  gzip on;
  gzip_types text/css application/javascript image/svg+xml application/json;

  server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    absolute_redirect off;

    # nginx drops server-level add_header lines in any location that sets its own, so every location includes the
    # full set (security-headers.conf, which also holds the CSP) and adds only its Cache-Control.
    include /etc/nginx/security-headers.conf;

    location = /healthz {
      access_log off;
      default_type text/plain;
      return 200 "ok\n";
    }

    # Hashed build assets never change.
    location /assets/ {
      include /etc/nginx/security-headers.conf;
      add_header Cache-Control "public, max-age=31536000, immutable" always;
      try_files $uri =404;
    }

    location / {
      include /etc/nginx/security-headers.conf;
      add_header Cache-Control "no-cache" always;
      try_files $uri $uri/ /index.html;
    }
  }
}
