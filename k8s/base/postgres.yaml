# In-cluster PostgreSQL for the backend (one replica, persistent volume). Password from biatec-chat-generated
# (postgres-password); it is only applied when the volume is first initialised. Schema migrations run as a deploy step
# (.github/workflows/deploy-stage.yml), not on backend startup.
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: biatec-chat-postgres
  labels: {app.kubernetes.io/name: biatec-chat-postgres, app.kubernetes.io/part-of: biatec-chat}
spec:
  serviceName: biatec-chat-postgres
  replicas: 1
  selector:
    matchLabels: {app.kubernetes.io/name: biatec-chat-postgres}
  template:
    metadata:
      labels: {app.kubernetes.io/name: biatec-chat-postgres, app.kubernetes.io/part-of: biatec-chat}
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 999
        runAsGroup: 999
        fsGroup: 999
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: postgres
          image: postgres:16
          ports:
            - {name: postgres, containerPort: 5432}
          env:
            - {name: POSTGRES_USER, value: biatec}
            - {name: POSTGRES_DB, value: biatec_chat}
            # Subdirectory, so the volume's lost+found doesn't block initdb.
            - {name: PGDATA, value: /var/lib/postgresql/data/pgdata}
            - name: POSTGRES_PASSWORD
              valueFrom: {secretKeyRef: {name: biatec-chat-generated, key: postgres-password}}
          readinessProbe:
            exec: {command: [pg_isready, -U, biatec, -d, biatec_chat]}
            periodSeconds: 10
          livenessProbe:
            exec: {command: [pg_isready, -U, biatec, -d, biatec_chat]}
            periodSeconds: 30
            failureThreshold: 5
          resources:
            requests: {cpu: 100m, memory: 256Mi}
            limits: {memory: 1Gi}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: {drop: [ALL]}
          volumeMounts:
            - {name: data, mountPath: /var/lib/postgresql/data}
            - {name: run, mountPath: /var/run/postgresql}
      volumes:
        - name: run
          emptyDir: {}
  volumeClaimTemplates:
    - metadata:
        name: data
        labels: {app.kubernetes.io/name: biatec-chat-postgres, app.kubernetes.io/part-of: biatec-chat}
      spec:
        accessModes: [ReadWriteOnce]
        resources:
          requests: {storage: 10Gi}
---
apiVersion: v1
kind: Service
metadata:
  name: biatec-chat-postgres
  labels: {app.kubernetes.io/name: biatec-chat-postgres, app.kubernetes.io/part-of: biatec-chat}
spec:
  selector: {app.kubernetes.io/name: biatec-chat-postgres}
  ports:
    - {name: postgres, port: 5432, targetPort: postgres}
---
# Only the backend reaches the database.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: biatec-chat-postgres
  labels: {app.kubernetes.io/name: biatec-chat-postgres, app.kubernetes.io/part-of: biatec-chat}
spec:
  podSelector:
    matchLabels: {app.kubernetes.io/name: biatec-chat-postgres}
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels: {app.kubernetes.io/name: biatec-chat-backend}
      ports:
        - {port: 5432}
