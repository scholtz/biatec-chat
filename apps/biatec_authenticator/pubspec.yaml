name: biatec_authenticator
description: Biatec Authenticator, device-bound approval of high-value actions (scaffold).
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ^3.5.0

dependencies:
  flutter:
    sdk: flutter
  http: ^1.2.2
  crypto: ^3.0.0
  mobile_scanner: ^7.0.0
  path_provider: ^2.1.0
  # Argon2id and AES-GCM for the backup file (maintained library, no homegrown cryptography); also the test key store.
  pointycastle: ^4.0.0
  flutter_secure_storage: ^9.2.2
  firebase_core: ^5.0.0
  firebase_messaging: ^17.0.0
  share_plus: ^12.0.2
  file_selector: ^1.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
