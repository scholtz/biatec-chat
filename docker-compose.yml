# Local development dependencies. Dev-only credentials; nothing here is used in AWS.
# Fixed project name: without it compose names the project after the folder, so a second checkout (worktree, clone)
# tries to start another Redis/Postgres on the same ports and fails with "port is already allocated".
name: biatec-chat

services:
  redis:
    image: redis:7
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: biatec
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-biatec-dev-only}
      POSTGRES_DB: biatec_chat
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U biatec -d biatec_chat"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Node builder sidecar (CLAMM and algo-safe builders). Internal: the .NET backend calls it with the shared secret.
  builders:
    build:
      context: .
      dockerfile: builders/sidecar/Dockerfile
    environment:
      # Local dev default only. Production/k8s must inject a real secret with NO default. The backend reads the same value
      # as Builders__InternalSecret (and Builders__BaseAddress, e.g. http://builders:3100; Builders__TimeoutSeconds optional).
      BUILDERS_INTERNAL_SECRET: ${BUILDERS_INTERNAL_SECRET:-builders-dev-only-secret}
      ALGOD_URL_TESTNET: ${ALGOD_URL_TESTNET:-https://testnet-api.4160.nodely.dev}
      ALGOD_URL_MAINNET: ${ALGOD_URL_MAINNET:-https://mainnet-api.4160.nodely.dev}
    ports:
      - "127.0.0.1:3100:3100"

volumes:
  redis-data:
  postgres-data:
