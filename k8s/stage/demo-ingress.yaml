# Demo site on its own host. *.stage.chat.biatec.io already resolves to the cluster ingress, so this needs no DNS
# change; cert-manager issues the certificate. Same site as the backend (stage.chat.biatec.io, both under biatec.io),
# so the SameSite=Lax session cookie works; the origin is registered on the tenant by deploy.yml (demo_url).
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: biatec-chat-demo
  labels: {app.kubernetes.io/name: biatec-chat-demo, app.kubernetes.io/part-of: biatec-chat}
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
spec:
  ingressClassName: nginx
  tls:
    - hosts: [demo.stage.chat.biatec.io]
      secretName: biatec-chat-demo-stage-tls
  rules:
    - host: demo.stage.chat.biatec.io
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service: {name: biatec-chat-demo, port: {name: http}}
