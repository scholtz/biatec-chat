# Pull requests that move the pinned GitHub Actions (BCHAT-017). The pin is the commit SHA; the comment after it names the release.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    # A release has to be a week old before it is proposed, so a freshly published (possibly compromised) one is not adopted at once.
    cooldown:
      default-days: 7
    groups:
      github-actions:
        patterns: ["*"]
    commit-message:
      prefix: "ci"
  - package-ecosystem: docker
    # One entry for every Dockerfile directory: Dependabot groups them, so the digest of a base image shared by several Dockerfiles
    # (node:22-alpine) moves in one pull request and the images never run on different bases.
    directories:
      - /backend
      - /builders/sidecar
      - /apps/demo
      - /packages/consent-protocol/mock-oidc
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    # Node moves between LTS lines by a decision, not by a bot: the images run pnpm through corepack, which Node 25 no longer ships, and a
    # non-LTS release is not what the deploy should run. Digest and minor updates of the current line still come through.
    ignore:
      - dependency-name: node
        update-types: ["version-update:semver-major"]
    groups:
      docker-base-images:
        patterns: ["*"]
    commit-message:
      prefix: "build"
