# Pull requests that move the pinned GitHub Actions (BCHAT-017). The pin is the commit SHA; the comment after it names the release.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    # A release has to be a week old before it is proposed, so a freshly published (possibly compromised) one is not adopted at once.
    cooldown:
      default-days: 7
    groups:
      github-actions:
        patterns: ["*"]
    commit-message:
      prefix: "ci"
  - package-ecosystem: docker
    directory: /backend
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    commit-message:
      prefix: "build"
  - package-ecosystem: docker
    directory: /builders/sidecar
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    commit-message:
      prefix: "build"
  - package-ecosystem: docker
    directory: /apps/demo
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    commit-message:
      prefix: "build"
  - package-ecosystem: docker
    directory: /packages/consent-protocol/mock-oidc
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    commit-message:
      prefix: "build"
