# The cluster has no dynamic provisioner, so the StatefulSet claims (base/postgres.yaml, base/redis.yaml) are bound to
# volumes on the NVMe drive of node sch-g-04. Each PV is pre-bound to its claim and pinned to the node. They are `local`
# volumes (the same host directory a hostPath would use) because the kubelet applies the pods' fsGroup to them, so the
# non-root Postgres/Redis users can write; a hostPath directory would stay root-owned.
#
# The directories must exist on the node (created once by an admin, docs/cicd.md "Storage"):
#   mkdir -p /mnt/nvme1/chat-stage/postgres /mnt/nvme1/chat-stage/redis
# Retain: deleting a claim never deletes the data on the drive.
apiVersion: v1
kind: PersistentVolume
metadata:
  name: biatec-chat-stage-postgres
  labels: {app.kubernetes.io/name: biatec-chat-postgres, app.kubernetes.io/part-of: biatec-chat}
spec:
  capacity: {storage: 10Gi}
  accessModes: [ReadWriteOnce]
  persistentVolumeReclaimPolicy: Retain
  volumeMode: Filesystem
  claimRef: {namespace: biatec-chat-stage, name: data-biatec-chat-postgres-0}
  local: {path: /mnt/nvme1/chat-stage/postgres}
  nodeAffinity:
    required:
      nodeSelectorTerms:
        - matchExpressions:
            - {key: kubernetes.io/hostname, operator: In, values: [sch-g-04]}
---
apiVersion: v1
kind: PersistentVolume
metadata:
  name: biatec-chat-stage-redis
  labels: {app.kubernetes.io/name: biatec-chat-redis, app.kubernetes.io/part-of: biatec-chat}
spec:
  capacity: {storage: 1Gi}
  accessModes: [ReadWriteOnce]
  persistentVolumeReclaimPolicy: Retain
  volumeMode: Filesystem
  claimRef: {namespace: biatec-chat-stage, name: data-biatec-chat-redis-0}
  local: {path: /mnt/nvme1/chat-stage/redis}
  nodeAffinity:
    required:
      nodeSelectorTerms:
        - matchExpressions:
            - {key: kubernetes.io/hostname, operator: In, values: [sch-g-04]}
