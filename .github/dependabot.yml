# Pull requests that move the pinned GitHub Actions (BCHAT-017). The pin is the commit SHA; the comment after it names the release.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    # A release has to be a week old before it is proposed, so a freshly published (possibly compromised) one is not adopted at once.
    cooldown:
      default-days: 7
    groups:
      github-actions:
        patterns: ["*"]
    commit-message:
      prefix: "ci"
  - package-ecosystem: docker
    # One entry for every Dockerfile directory: Dependabot groups them, so the digest of a base image shared by several Dockerfiles
    # (the Node base) moves in one pull request and the images never run on different bases.
    directories:
      - /backend
      - /builders/sidecar
      - /apps/demo
      - /packages/consent-protocol/mock-oidc
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    # Node 25 is not an LTS line and has no corepack, which the images use to run pnpm: skip it. LTS majors (24, 26, ...) still come as pull requests.
    # Odd-numbered majors are non-LTS; add the next one here when it appears.
    ignore:
      - dependency-name: node
        versions: ["25.x", "27.x"]
    groups:
      docker-base-images:
        patterns: ["*"]
    commit-message:
      prefix: "build"
