apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: biatec-chat-stage
resources:
  - ../base
  - storage.yaml
  - ingress.yaml
  - demo-ingress.yaml
  - dex-beta-ingress.yaml
patches:
  - path: backend-config.patch.yaml
  - path: builders-env.patch.yaml
images:
  - name: scholtz2/biatec-chat-backend
    newTag: stage
  - name: scholtz2/biatec-chat-builders
    newTag: stage
  - name: scholtz2/biatec-chat-demo
    newTag: stage
