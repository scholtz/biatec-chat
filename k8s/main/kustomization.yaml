apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: biatec-chat-main
resources:
  - ../base
  - ingress.yaml
patches:
  - path: backend-config.patch.yaml
  - path: builders-env.patch.yaml
  # The demo site (k8s/base/demo.yaml) runs on stage only; promote-production.yml has no demo image to deploy.
  - patch: |-
      $patch: delete
      apiVersion: apps/v1
      kind: Deployment
      metadata: {name: biatec-chat-demo}
  - patch: |-
      $patch: delete
      apiVersion: v1
      kind: Service
      metadata: {name: biatec-chat-demo}
images:
  - name: scholtz2/biatec-chat-backend
    newTag: REPLACE-WITH-RELEASE-SHA
  - name: scholtz2/biatec-chat-builders
    newTag: REPLACE-WITH-RELEASE-SHA
