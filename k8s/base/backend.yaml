apiVersion: v1
kind: ConfigMap
metadata:
  name: biatec-chat-backend
  labels: {app.kubernetes.io/name: biatec-chat-backend, app.kubernetes.io/part-of: biatec-chat}
data:
  ASPNETCORE_ENVIRONMENT: Production
  # Oidc__*, Mcp__Endpoint and Algod__Networks__* are environment specific: set per overlay (k8s/main, k8s/stage).
  Bedrock__Region: eu-central-1
  Bedrock__AnonymousModelId: eu.anthropic.claude-sonnet-4-5-20250929-v1:0
  Bedrock__AuthenticatedModelId: eu.anthropic.claude-opus-4-5-20251101-v1:0
  Bedrock__MaxTokens: "4096"
  # Guardrail from infra/guardrail/create.sh in the AWS account that owns the role (hackathon account: rwa0b0by3y18 v1).
  Bedrock__Guardrail__Enabled: "true"
  Bedrock__Guardrail__GuardrailId: rwa0b0by3y18
  Bedrock__Guardrail__GuardrailVersion: "1"
  Builders__BaseAddress: http://biatec-chat-builders:3100
  # The vault wraps its data keys with the master key in biatec-chat-generated (Vault__MasterKey below), generated
  # once by the deploy; never the local Dev key. AWS is used for Bedrock only.
  Vault__KeyProvider: Secret
  # No production IEvidenceKeyStore exists yet: signing keys are in-memory, lost on restart and differ per replica.
  # Explicit, documented decision (see k8s/README.md); remove once a persistent key store is registered.
  Evidence__AllowEphemeralKeys: "true"
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: biatec-chat-backend
  labels: {app.kubernetes.io/name: biatec-chat-backend, app.kubernetes.io/part-of: biatec-chat}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: biatec-chat-backend
  labels: {app.kubernetes.io/name: biatec-chat-backend, app.kubernetes.io/part-of: biatec-chat}
spec:
  replicas: 2
  selector:
    matchLabels: {app.kubernetes.io/name: biatec-chat-backend}
  template:
    metadata:
      labels: {app.kubernetes.io/name: biatec-chat-backend, app.kubernetes.io/part-of: biatec-chat}
    spec:
      # AWS access (Bedrock only) without keys: the projected service-account token below is exchanged for the IAM role
      # (sts:AssumeRoleWithWebIdentity) created by infra/aws/k8s-role.sh. Works on any cluster, EKS or not.
      serviceAccountName: biatec-chat-backend
      securityContext:
        runAsNonRoot: true
        runAsUser: 1654
        runAsGroup: 1654
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: backend
          image: scholtz2/biatec-chat-backend:latest
          imagePullPolicy: Always
          ports:
            - {name: http, containerPort: 8080}
          envFrom:
            - configMapRef: {name: biatec-chat-backend}
          env:
            - name: AWS_REGION
              value: eu-central-1
            # Optional, so a secret without the key (an older deployment, or EKS with IRSA) still starts.
            - name: AWS_ROLE_ARN
              valueFrom: {secretKeyRef: {name: biatec-chat-secrets, key: aws-role-arn, optional: true}}
            - name: AWS_WEB_IDENTITY_TOKEN_FILE
              value: /var/run/secrets/aws/token
            # In-cluster databases (postgres.yaml, redis.yaml); passwords are generated by the deploy into
            # biatec-chat-generated, and the connection strings are built here from them.
            - name: POSTGRES_PASSWORD
              valueFrom: {secretKeyRef: {name: biatec-chat-generated, key: postgres-password}}
            - name: REDIS_PASSWORD
              valueFrom: {secretKeyRef: {name: biatec-chat-generated, key: redis-password}}
            - name: Postgres__ConnectionString
              value: Host=biatec-chat-postgres;Port=5432;Database=biatec_chat;Username=biatec;Password=$(POSTGRES_PASSWORD)
            - name: Redis__ConnectionString
              value: biatec-chat-redis:6379,password=$(REDIS_PASSWORD),abortConnect=false
            - name: Vault__MasterKey
              valueFrom: {secretKeyRef: {name: biatec-chat-generated, key: vault-master-key}}
            # Resolves the seeded tenant's ClientSecretRef secret://biatec-chat/oidc-client-secret.
            - name: Secrets__biatec-chat__oidc-client-secret
              valueFrom: {secretKeyRef: {name: biatec-chat-secrets, key: oidc-client-secret}}
            - name: Builders__InternalSecret
              valueFrom: {secretKeyRef: {name: biatec-chat-generated, key: builders-internal-secret}}
          startupProbe:
            httpGet: {path: /health, port: http}
            periodSeconds: 3
            failureThreshold: 30
          readinessProbe:
            httpGet: {path: /health, port: http}
            periodSeconds: 10
            timeoutSeconds: 3
          livenessProbe:
            httpGet: {path: /health/live, port: http}
            periodSeconds: 20
            timeoutSeconds: 3
          resources:
            requests: {cpu: 100m, memory: 256Mi}
            limits: {memory: 768Mi}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          volumeMounts:
            - {name: tmp, mountPath: /tmp}
            - {name: aws-token, mountPath: /var/run/secrets/aws, readOnly: true}
      volumes:
        - name: tmp
          emptyDir: {}
        - name: aws-token
          projected:
            sources:
              - serviceAccountToken: {audience: sts.amazonaws.com, expirationSeconds: 3600, path: token}
---
apiVersion: v1
kind: Service
metadata:
  name: biatec-chat-backend
  labels: {app.kubernetes.io/name: biatec-chat-backend, app.kubernetes.io/part-of: biatec-chat}
spec:
  selector: {app.kubernetes.io/name: biatec-chat-backend}
  ports:
    - {name: http, port: 80, targetPort: http}
