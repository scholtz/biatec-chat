# Every push to main: run ci.yml, then build and push both images with an immutable tag and deploy k8s/stage to
# chat.stage.biatec.io. Credentials come only from the "Stage" GitHub environment secrets (docs/cicd.md lists them).
# Follows BiatecDEX deploy-stage.yml (Docker Hub, base64 KUBE_CONFIG, rollout status), but pins the tag through
# k8s/stage/kustomization.yaml at deploy time instead of committing it back to main.
name: deploy-stage

on:
  push:
    branches: [main]
    # Board syncs and docs don't change what runs.
    paths-ignore: ["kanban/**", "docs/**", "**/*.md"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-stage
  cancel-in-progress: false

env:
  BACKEND_IMAGE: scholtz2/biatec-chat-backend
  BUILDERS_IMAGE: scholtz2/biatec-chat-builders
  NAMESPACE: biatec-chat-stage

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  deploy:
    needs: ci
    runs-on: ubuntu-latest
    environment:
      name: Stage
      url: https://chat.stage.biatec.io
    steps:
      - uses: actions/checkout@v4

      # 1.<year>.<month>.<day>-<sha>-beta: Biatec's date scheme plus the commit, so every deploy has its own tag.
      - name: Compute version
        id: version
        run: echo "version=1.$(date -u '+%Y.%m.%d')-${GITHUB_SHA::7}-beta" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USER }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push backend
        uses: docker/build-push-action@v6
        with:
          context: .
          file: backend/Dockerfile
          push: true
          tags: ${{ env.BACKEND_IMAGE }}:${{ steps.version.outputs.version }}
          cache-from: type=gha,scope=backend
          cache-to: type=gha,scope=backend,mode=max

      - name: Build and push builders
        uses: docker/build-push-action@v6
        with:
          context: .
          file: builders/sidecar/Dockerfile
          push: true
          tags: ${{ env.BUILDERS_IMAGE }}:${{ steps.version.outputs.version }}
          cache-from: type=gha,scope=builders
          cache-to: type=gha,scope=builders,mode=max

      - uses: azure/setup-kubectl@v4

      - name: Configure kubeconfig
        env:
          KUBE_CONFIG: ${{ secrets.KUBE_CONFIG }}
        run: |
          mkdir -p "$HOME/.kube"
          echo "$KUBE_CONFIG" | base64 -d > "$HOME/.kube/config"
          chmod 600 "$HOME/.kube/config"

      # Optional: when POSTGRES_CONNECTION_STRING is set, biatec-chat-secrets is (re)created from the environment
      # secrets and all six must be present. Otherwise the cluster secret is managed out of band and left untouched.
      - name: Sync biatec-chat-secrets
        env:
          POSTGRES_CONNECTION_STRING: ${{ secrets.POSTGRES_CONNECTION_STRING }}
          REDIS_CONNECTION_STRING: ${{ secrets.REDIS_CONNECTION_STRING }}
          KMS_KEY_ID: ${{ secrets.KMS_KEY_ID }}
          OIDC_CLIENT_SECRET: ${{ secrets.OIDC_CLIENT_SECRET }}
          BUILDERS_INTERNAL_SECRET: ${{ secrets.BUILDERS_INTERNAL_SECRET }}
          AWS_ROLE_ARN: ${{ secrets.AWS_ROLE_ARN }}
        run: |
          if [ -z "$POSTGRES_CONNECTION_STRING" ]; then
            echo "POSTGRES_CONNECTION_STRING not set: leaving biatec-chat-secrets as it is in the cluster."
            exit 0
          fi
          for v in REDIS_CONNECTION_STRING KMS_KEY_ID OIDC_CLIENT_SECRET BUILDERS_INTERNAL_SECRET AWS_ROLE_ARN; do
            if [ -z "${!v}" ]; then echo "::error::Stage secret $v is missing (see docs/cicd.md)."; exit 1; fi
          done
          kubectl get namespace "$NAMESPACE" >/dev/null 2>&1 || kubectl create namespace "$NAMESPACE"
          kubectl create secret generic biatec-chat-secrets -n "$NAMESPACE" \
            --from-literal=postgres-connection-string="$POSTGRES_CONNECTION_STRING" \
            --from-literal=redis-connection-string="$REDIS_CONNECTION_STRING" \
            --from-literal=kms-key-id="$KMS_KEY_ID" \
            --from-literal=oidc-client-secret="$OIDC_CLIENT_SECRET" \
            --from-literal=builders-internal-secret="$BUILDERS_INTERNAL_SECRET" \
            --from-literal=aws-role-arn="$AWS_ROLE_ARN" \
            --dry-run=client -o yaml | kubectl apply -f -

      - name: Apply k8s/stage with the new tag
        run: |
          sed -i "s/newTag: stage$/newTag: ${{ steps.version.outputs.version }}/" k8s/stage/kustomization.yaml
          [ "$(grep -c "newTag: ${{ steps.version.outputs.version }}" k8s/stage/kustomization.yaml)" = 2 ]
          kubectl apply -k k8s/stage

      - name: Wait for rollout
        run: |
          kubectl rollout status deployment/biatec-chat-builders -n "$NAMESPACE" --timeout=5m
          kubectl rollout status deployment/biatec-chat-backend -n "$NAMESPACE" --timeout=5m

      - name: Remove kubeconfig
        if: always()
        run: rm -f "$HOME/.kube/config"
