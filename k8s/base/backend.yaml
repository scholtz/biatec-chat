apiVersion: v1
kind: ConfigMap
metadata:
  name: biatec-chat-backend
  labels: {app.kubernetes.io/name: biatec-chat-backend, app.kubernetes.io/part-of: biatec-chat}
data:
  ASPNETCORE_ENVIRONMENT: Production
  # Oidc__*, Mcp__Endpoint and Algod__Networks__* are environment specific: set per overlay (k8s/main, k8s/stage).
  Bedrock__Region: eu-central-1
  Bedrock__AnonymousModelId: eu.anthropic.claude-sonnet-4-5-20250929-v1:0
  Bedrock__AuthenticatedModelId: eu.anthropic.claude-opus-4-5-20251101-v1:0
  Bedrock__MaxTokens: "4096"
  # Guardrail from infra/guardrail/create.sh in the AWS account that owns the role (hackathon account: rwa0b0by3y18 v3).
  Bedrock__Guardrail__Enabled: "true"
  Bedrock__Guardrail__GuardrailId: rwa0b0by3y18
  Bedrock__Guardrail__GuardrailVersion: "3"
  # kb.search retrieves from this Bedrock Knowledge Base (docs/kb, synced by infra/kb/sync.sh) and falls back to the
  # local docs/kb search when it fails. The role needs bedrock:Retrieve on it (infra/aws/bedrock-role-policy.json).
  Kb__Bedrock__KnowledgeBaseId: DZZGQITEAS
  Builders__BaseAddress: http://biatec-chat-builders:3100
  # The vault wraps its data keys with the master key in biatec-chat-generated (Vault__MasterKey below), generated
  # once by the deploy; never the local Dev key. AWS is used for Bedrock only.
  Vault__KeyProvider: Secret
  # Evidence signing keys: private keys are derived from Evidence__Secret__MasterKey (biatec-chat-generated), public key
  # metadata (active/retired, dates) is shared by all replicas in PostgreSQL. See k8s/README.md.
  Evidence__KeyStore: Secret
  # Evidence anchoring (spec: Threat Model Highlights): every 10 minutes the head hashes are batched into one Merkle root in
  # a note of an Algorand transaction from the evidence account. Testnet; the mnemonic is the biatec-chat-evidence-anchor
  # secret below (never in this file). With 2 replicas only one anchors per interval (PostgreSQL advisory lock). See k8s/README.md.
  Evidence__Anchoring__Enabled: "true"
  Evidence__Anchoring__Network: testnet
  Evidence__Anchoring__IndexerUrl: https://testnet-idx.4160.nodely.dev
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: biatec-chat-backend
  labels: {app.kubernetes.io/name: biatec-chat-backend, app.kubernetes.io/part-of: biatec-chat}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: biatec-chat-backend
  labels: {app.kubernetes.io/name: biatec-chat-backend, app.kubernetes.io/part-of: biatec-chat}
spec:
  replicas: 2
  selector:
    matchLabels: {app.kubernetes.io/name: biatec-chat-backend}
  template:
    metadata:
      labels: {app.kubernetes.io/name: biatec-chat-backend, app.kubernetes.io/part-of: biatec-chat}
    spec:
      # AWS access (Bedrock only) without access keys, through IAM Roles Anywhere: the AWS SDK runs the aws_signing_helper
      # in the image (credential_process in the config file of the biatec-chat-aws secret), which signs with this
      # environment's client certificate and gets short-lived role credentials. Created by infra/aws/rolesanywhere.sh.
      # Needs nothing from the cluster itself (no service-account issuer reachable by AWS).
      serviceAccountName: biatec-chat-backend
      securityContext:
        runAsNonRoot: true
        runAsUser: 1654
        runAsGroup: 1654
        fsGroup: 1654
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: backend
          image: scholtz2/biatec-chat-backend:latest
          imagePullPolicy: Always
          ports:
            - {name: http, containerPort: 8080}
          envFrom:
            - configMapRef: {name: biatec-chat-backend}
          env:
            - name: AWS_REGION
              value: eu-central-1
            - name: AWS_CONFIG_FILE
              value: /var/run/secrets/aws-rolesanywhere/config
            # In-cluster databases (postgres.yaml, redis.yaml); passwords are generated by the deploy into
            # biatec-chat-generated, and the connection strings are built here from them.
            - name: POSTGRES_PASSWORD
              valueFrom: {secretKeyRef: {name: biatec-chat-generated, key: postgres-password}}
            - name: REDIS_PASSWORD
              valueFrom: {secretKeyRef: {name: biatec-chat-generated, key: redis-password}}
            - name: Postgres__ConnectionString
              value: Host=biatec-chat-postgres;Port=5432;Database=biatec_chat;Username=biatec;Password=$(POSTGRES_PASSWORD)
            - name: Redis__ConnectionString
              value: biatec-chat-redis:6379,password=$(REDIS_PASSWORD),abortConnect=false
            - name: Vault__MasterKey
              valueFrom: {secretKeyRef: {name: biatec-chat-generated, key: vault-master-key}}
            # Resolves the seeded tenant's ClientSecretRef secret://biatec-chat/oidc-client-secret.
            - name: Secrets__biatec-chat__oidc-client-secret
              valueFrom: {secretKeyRef: {name: biatec-chat-secrets, key: oidc-client-secret}}
            - name: Evidence__Secret__MasterKey
              valueFrom: {secretKeyRef: {name: biatec-chat-generated, key: evidence-master-key}}
            # Mnemonic of the evidence account (25 words). optional: the pods start without it, but anchoring then fails
            # (and logs) every interval until the secret exists.
            - name: Evidence__Anchoring__AccountMnemonic
              valueFrom: {secretKeyRef: {name: biatec-chat-evidence-anchor, key: account-mnemonic, optional: true}}
            - name: Builders__InternalSecret
              valueFrom: {secretKeyRef: {name: biatec-chat-generated, key: builders-internal-secret}}
          startupProbe:
            httpGet: {path: /health, port: http}
            periodSeconds: 3
            failureThreshold: 30
          readinessProbe:
            httpGet: {path: /health, port: http}
            periodSeconds: 10
            timeoutSeconds: 3
          livenessProbe:
            httpGet: {path: /health/live, port: http}
            periodSeconds: 20
            timeoutSeconds: 3
          resources:
            requests: {cpu: 100m, memory: 256Mi}
            limits: {memory: 768Mi}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          volumeMounts:
            - {name: tmp, mountPath: /tmp}
            - {name: aws-rolesanywhere, mountPath: /var/run/secrets/aws-rolesanywhere, readOnly: true}
      volumes:
        - name: tmp
          emptyDir: {}
        # config (credential_process line with the ARNs), certificate.pem and private-key.pem; see deploy.yml.
        - name: aws-rolesanywhere
          secret: {secretName: biatec-chat-aws, defaultMode: 0440}
---
apiVersion: v1
kind: Service
metadata:
  name: biatec-chat-backend
  labels: {app.kubernetes.io/name: biatec-chat-backend, app.kubernetes.io/part-of: biatec-chat}
spec:
  selector: {app.kubernetes.io/name: biatec-chat-backend}
  ports:
    - {name: http, port: 80, targetPort: http}
