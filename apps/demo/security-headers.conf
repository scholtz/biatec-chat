# Included by every location of nginx.conf. __BACKEND_ORIGIN__ is replaced at image build time (Dockerfile,
# BACKEND_URL): the page may talk to that backend and nothing else.
# style-src needs 'unsafe-inline': the widget injects its stylesheet into its shadow root as a <style> element, and
# PrimeVue (dex.html) injects its theme the same way. No inline or third-party script is allowed.
add_header Content-Security-Policy "default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src __BACKEND_ORIGIN__; manifest-src 'self'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'; object-src 'none'" always;
add_header X-Content-Type-Options nosniff always;
add_header Referrer-Policy strict-origin-when-cross-origin always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
