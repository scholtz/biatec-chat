# Builds and tests everything on every pull request. On main it runs as the first stage of deploy-stage.yml
# (workflow_call), so a push to main is tested once and deployed only when this passes. Needs no secrets. See docs/cicd.md.
name: ci

on:
  pull_request:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Which parts of the repository a pull request touches. The authenticator jobs build an obfuscated, signed release APK, so backend-only and
  # widget-only changes do not wait for them. Everything that is not a pull request (main through deploy-stage.yml, a manual run) runs them all,
  # so what is deployed is always fully tested.
  changes:
    runs-on: ubuntu-latest
    outputs:
      authenticator: ${{ steps.filter.outputs.authenticator }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # A pull request is checked out as a merge commit: its first parent is the base, so two commits are enough to see what the PR changes.
          fetch-depth: 2
      - id: filter
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          if [ "$EVENT_NAME" != "pull_request" ]; then
            echo "authenticator=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          CHANGED="$(git diff --name-only HEAD^1 HEAD)"
          echo "$CHANGED"
          # The app, the consent protocol and mock Biatec OIDC its tests talk to, the documents the MASVS matrix check reads, and this workflow.
          if echo "$CHANGED" | grep -Eq '^(apps/biatec_authenticator/|packages/consent-protocol/|docs/(AUTHENTICATOR-|threat-model\.md|required-changes-biatec-oidc\.md)|\.github/workflows/ci\.yml)'; then
            echo "authenticator=true" >> "$GITHUB_OUTPUT"
          else
            echo "authenticator=false" >> "$GITHUB_OUTPUT"
            echo "::notice::No authenticator change: its jobs are skipped."
          fi

  backend:
    runs-on: ubuntu-latest
    # Integration tests use the docker-compose dev databases (throwaway CI containers, dev-only password).
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: biatec
          POSTGRES_PASSWORD: biatec-dev-only
          POSTGRES_DB: biatec_chat
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U biatec -d biatec_chat" --health-interval 5s --health-timeout 3s --health-retries 10
      redis:
        image: redis:7
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 3s --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.x
      - name: Test
        run: dotnet test backend/Biatec.Chat.slnx -c Release --logger "trx;LogFileName=results.trx" --results-directory test-results
      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: backend-test-results
          path: test-results

  js:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # The widget and builders import @biatec/chat-protocol from its dist, so it is built first.
      - name: Build chat-protocol
        run: pnpm --filter @biatec/chat-protocol build
      # The widget typecheck also covers playground/dex, which imports @biatec/chat-widget from its dist.
      - name: Build chat-widget
        run: pnpm --filter @biatec/chat-widget build
      - name: Typecheck
        run: |
          pnpm --filter @biatec/chat-widget typecheck
          pnpm --filter builders typecheck
      - name: Test
        run: |
          pnpm --filter @biatec/chat-widget test
          pnpm --filter builders test
          pnpm --filter @biatec/consent-protocol test
          pnpm --filter mock-oidc test
          pnpm --filter @biatec/consent-protocol conformance
          pnpm --filter @biatec/evidence-verifier test
      - name: Build builders
        run: pnpm --filter builders build
      # The demo site (apps/demo) typechecks and builds against the widget's dist; its tests run axe on the page.
      - name: Demo site
        run: |
          pnpm --filter demo build
          pnpm --filter demo test
      # The administrator dashboard (apps/admin, docs/admin-dashboard.md) is built into the backend image.
      - name: Admin dashboard
        run: |
          pnpm --filter @biatec/admin typecheck
          pnpm --filter @biatec/admin test
          pnpm --filter @biatec/admin build

  authenticator:
    needs: changes
    if: needs.changes.outputs.authenticator == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/biatec_authenticator
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable
          cache: true
      # The JDK that build.gradle.kts targets, so the release build does not change with the runner image's default JDK.
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "17"
          # The release build downloads Gradle, AGP and Kotlin; caching them keeps every run from fetching them again.
          cache: gradle
          cache-dependency-path: |
            apps/biatec_authenticator/android/*.gradle*
            apps/biatec_authenticator/android/app/*.gradle*
            apps/biatec_authenticator/android/gradle/wrapper/gradle-wrapper.properties
      - run: flutter pub get
      - run: flutter analyze
      # Before the build, so a failing Gradle, signing or R8 step still reports the Dart tests.
      - run: flutter test
      # The release build is obfuscated and its debug symbols are split off (BCHAT-008, T-227), signed here with a throwaway key that exists
      # only for this job, so the build itself, and the merged release manifest the hardening test reads, are checked on every change.
      - name: Release build (obfuscated, throwaway signing key)
        run: |
          KEYPASS="$(openssl rand -hex 24)"
          keytool -genkeypair -keystore android/ci-throwaway.jks -alias ci -keyalg RSA -keysize 2048 -validity 2 \
            -storepass "$KEYPASS" -keypass "$KEYPASS" -dname "CN=biatec-ci"
          {
            echo "storeFile=ci-throwaway.jks"
            echo "storePassword=$KEYPASS"
            echo "keyAlias=ci"
            echo "keyPassword=$KEYPASS"
          } > android/key.properties
          # The build number the app reports (the part after the plus sign of the version) must be given, or the update check would compare against 1.
          APP_BUILD="$(sed -n 's/^version:.*+\([0-9][0-9]*\)$/\1/p' pubspec.yaml)"
          test -n "$APP_BUILD"
          flutter build apk --release --obfuscate --split-debug-info=build/symbols \
            --dart-define=OIDC_BASE_URL=https://oidc.example --dart-define=APP_BUILD="$APP_BUILD"
      # The hardening test again, now with the merged release manifest. REQUIRE_MERGED_MANIFEST makes a missing merged manifest a failure,
      # not a skipped test.
      - name: Hardening checks against the merged release manifest
        env:
          REQUIRE_MERGED_MANIFEST: "1"
        run: flutter test test/platform_hardening_test.dart
      # Also when the build failed: the throwaway key and its password must not stay in the workspace.
      - name: Remove the throwaway signing key
        if: always()
        run: rm -f android/key.properties android/ci-throwaway.jks
      # These symbols belong to this CI build only. A shipped release is built with its own --split-debug-info and keeps its own symbols.
      # The repository is public and so are its workflow artifacts, so the symbols are published only encrypted (OpenPGP, AES-256)
      # with the AUTHENTICATOR_SYMBOLS_PASSPHRASE secret; without the secret (a fork, or before it is set) they are not published.
      - name: Encrypt debug symbols of this build
        id: symbols
        env:
          SYMBOLS_PASSPHRASE: ${{ secrets.AUTHENTICATOR_SYMBOLS_PASSPHRASE }}
        run: |
          if [ -z "$SYMBOLS_PASSPHRASE" ]; then
            echo "::notice::AUTHENTICATOR_SYMBOLS_PASSPHRASE is not set: the debug symbols are not published."
            echo "ready=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          tar -C build -czf build/symbols.tar.gz symbols
          printf '%s' "$SYMBOLS_PASSPHRASE" | gpg --batch --yes --pinentry-mode loopback --passphrase-fd 0 \
            --symmetric --cipher-algo AES256 --s2k-digest-algo SHA512 --s2k-count 65011712 \
            -o build/symbols.tar.gz.gpg build/symbols.tar.gz
          rm -f build/symbols.tar.gz
          echo "ready=true" >> "$GITHUB_OUTPUT"
      - name: Upload encrypted debug symbols of this build
        if: steps.symbols.outputs.ready == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: authenticator-debug-symbols
          path: apps/biatec_authenticator/build/symbols.tar.gz.gpg
          retention-days: 7
          if-no-files-found: error

  # The checks that keep docs/AUTHENTICATOR-SECURITY.md true (T-230). Separate from the build job so a failing release build still reports them.
  authenticator-security:
    needs: changes
    if: needs.changes.outputs.authenticator == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable
          cache: true
      # The lockfile must be committed, and resolving the dependencies must not change it: what is scanned and listed in the SBOM is what
      # is built.
      - name: The lockfile is committed and unchanged by pub get
        working-directory: apps/biatec_authenticator
        run: |
          git ls-files --error-unmatch pubspec.lock
          flutter pub get
          git diff --exit-code -- pubspec.lock || { echo "::error::pub get changed pubspec.lock: commit the updated lockfile."; exit 1; }
      # Known vulnerabilities in the locked dependencies (OSV). Fails the job when it finds one.
      # The checks after the lockfile step run even when one before them failed, so one failure does not hide the others.
      - name: OSV scan of pubspec.lock
        if: ${{ !cancelled() }}
        uses: google/osv-scanner-action/osv-scanner-action@b1d267aea5211fa648d9d442fa64b90dbdcbdd36 # v2.7.0
        with:
          scan-args: |-
            --lockfile=apps/biatec_authenticator/pubspec.lock
      # A CycloneDX bill of materials of the authenticator's dependencies, kept with the run.
      - name: SBOM (CycloneDX)
        if: ${{ !cancelled() }}
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          path: apps/biatec_authenticator
          format: cyclonedx-json
          artifact-name: authenticator-sbom.cdx.json
          upload-artifact-retention: 30
      # No print or debugPrint in lib/, no secret-like strings in the app's source.
      - name: Source gates
        if: ${{ !cancelled() }}
        working-directory: apps/biatec_authenticator
        run: dart run tool/gates.dart
      # Every MASVS control is in the matrix, with a status, and the evidence it links exists.
      - name: MASVS matrix
        if: ${{ !cancelled() }}
        working-directory: apps/biatec_authenticator
        run: dart run tool/matrix_check.dart
      # By name, so a renamed or removed file fails here instead of quietly dropping out of the run.
      - name: Hardening and pinning tests
        if: ${{ !cancelled() }}
        working-directory: apps/biatec_authenticator
        run: flutter test test/platform_hardening_test.dart test/pinning test/tool

  images:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Every base image is pinned by digest (BCHAT-018); Dependabot proposes the new digests.
      - name: Check Dockerfile base image pins
        run: |
          python3 -c 'import yaml' 2>/dev/null || (sudo apt-get update -qq && sudo apt-get install -y -qq python3-yaml)
          python3 infra/ci/check_dockerfile_pins.py
          python3 infra/ci/check_dockerfile_pins.py --self-test
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build backend image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: backend/Dockerfile
          push: false
          cache-from: type=gha,scope=backend
          cache-to: type=gha,scope=backend,mode=max
      - name: Build builders image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: builders/sidecar/Dockerfile
          push: false
          cache-from: type=gha,scope=builders
          cache-to: type=gha,scope=builders,mode=max
      - name: Build mock OIDC image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: packages/consent-protocol/mock-oidc/Dockerfile
          push: false
          cache-from: type=gha,scope=mock-oidc
          cache-to: type=gha,scope=mock-oidc,mode=max
      - name: Build demo image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: apps/demo/Dockerfile
          push: false
          # Build check only; the stage image is built for the stage backend in deploy-stage.yml.
          build-args: |
            BACKEND_URL=https://backend.invalid
          cache-from: type=gha,scope=demo
          cache-to: type=gha,scope=demo,mode=max
      - name: Render k8s overlays
        run: |
          kubectl kustomize k8s/stage > /dev/null
          kubectl kustomize k8s/main > /dev/null

  # The deploy identity's Role must cover exactly what the overlays and deploy.yml do and grant nothing wider (BCHAT-020, k8s/rbac).
  # Its own job, so a failed image build does not hide RBAC drift. kubectl and jq are on the runner image; PyYAML is installed if missing.
  deploy-rbac:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Check the deploy RBAC
        run: |
          python3 -c 'import yaml' 2>/dev/null || (sudo apt-get update -qq && sudo apt-get install -y -qq python3-yaml)
          python3 k8s/rbac/check_role.py
          python3 k8s/rbac/check_role.py --self-test
          bash k8s/rbac/test-preflight.sh
