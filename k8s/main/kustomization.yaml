apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: biatec-chat-main
resources:
  - namespace.yaml
  - ../base
  - ingress.yaml
patches:
  - path: backend-config.patch.yaml
  - path: builders-env.patch.yaml
images:
  - name: ghcr.io/scholtz/biatec-chat-backend
    newTag: REPLACE-WITH-RELEASE-SHA
  - name: ghcr.io/scholtz/biatec-chat-builders
    newTag: REPLACE-WITH-RELEASE-SHA
