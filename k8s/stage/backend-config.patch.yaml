apiVersion: v1
kind: ConfigMap
metadata:
  name: biatec-chat-backend
data:
  Oidc__Issuer: https://stage.oidc.biatec.io
  Oidc__McpResource: https://stage.mcp.biatec.io/tools
  Mcp__Endpoint: https://stage.mcp.biatec.io/tools
  Algod__Networks__mainnet__Url: https://mainnet-api.4160.nodely.dev
  Algod__Networks__testnet__Url: https://testnet-api.4160.nodely.dev
  # X-Forwarded-For is trusted only from these peers (ingress-nginx runs in-cluster). RFC 1918 covers the pod and node ranges; narrow
  # to the ingress pod CIDR when it is known. Without it every visitor shares the ingress pod's address (BCHAT-005).
  ForwardedHeaders__KnownNetworks__0: 10.0.0.0/8
  ForwardedHeaders__KnownNetworks__1: 172.16.0.0/12
  ForwardedHeaders__KnownNetworks__2: 192.168.0.0/16
  # Biatec DEX beta serves this backend at https://beta.dex.biatec.io/chat (k8s/stage/dex-beta-ingress.yaml routes it with the
  # full path, prefix included). Needs a tenant for that host, which the deploy provisions from these keys (docs/cicd.md, "Mounted hosts").
  Hosting__Mounts__0__Host: beta.dex.biatec.io
  Hosting__Mounts__0__Prefix: /chat
  Hosting__Mounts__0__ClientKey: biatec-dex
  # Where evidence bundles tell verifiers to fetch the signing keys. Without it the URL is built from the request, which is
  # plain http behind the TLS-terminating ingress. The keys are the same on every host of this backend, so the mounted
  # host's bundles point here too.
  Evidence__PublicBaseUrl: https://stage.chat.biatec.io
