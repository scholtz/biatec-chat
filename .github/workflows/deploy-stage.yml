# Every push to main: run ci.yml, build and push the backend, builders and demo images, deploy them to stage (k8s/stage,
# stage.chat.biatec.io and the demo site demo.stage.chat.biatec.io).
# Production is never touched here: promote-production.yml re-tags the exact stage images. Follows BiatecDEX
# deploy-stage.yml (Docker Hub, date-based tag, base64 KUBE_CONFIG), but pins the tag at deploy time instead of
# committing it back to main. See docs/cicd.md.
name: deploy-stage

on:
  push:
    branches: [main]
    # Board syncs and docs don't change what runs.
    paths-ignore: ["kanban/**", "docs/**", "**/*.md"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-stage
  cancel-in-progress: false

env:
  BACKEND_IMAGE: scholtz2/biatec-chat-backend
  BUILDERS_IMAGE: scholtz2/biatec-chat-builders
  DEMO_IMAGE: scholtz2/biatec-chat-demo
  # The stage backend: the deploy's environment URL and tenant host, and the backend the demo image is built for
  # (bundle and CSP connect-src). One value, passed to the deploy job through the build job's outputs.
  STAGE_URL: https://stage.chat.biatec.io

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  build:
    needs: ci
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Keyless cosign signing: the job asks GitHub for an OIDC token, and the signature is bound to this workflow on main.
      id-token: write
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      url: ${{ env.STAGE_URL }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # 1.<year>.<month>.<day>-<sha7>: Biatec's date scheme plus the commit, so every build is unique. Stage images are
      # <version>-beta; promote-production.yml adds <version>-main to the same image.
      - name: Compute version
        id: version
        run: |
          version="1.$(date -u '+%Y.%m.%d')-${GITHUB_SHA::7}"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=$version-beta" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          username: ${{ secrets.DOCKERHUB_USER }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # The version label lets promote-production.yml find out what the moving `stage` tag points at. Provenance is
      # off so each tag is a plain image manifest whose labels imagetools can read.
      - name: Build and push backend
        id: backend
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: backend/Dockerfile
          push: true
          provenance: false
          tags: |
            ${{ env.BACKEND_IMAGE }}:${{ steps.version.outputs.tag }}
            ${{ env.BACKEND_IMAGE }}:stage
          labels: |
            org.opencontainers.image.version=${{ steps.version.outputs.version }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=backend
          cache-to: type=gha,scope=backend,mode=max

      - name: Build and push builders
        id: builders
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: builders/sidecar/Dockerfile
          push: true
          provenance: false
          tags: |
            ${{ env.BUILDERS_IMAGE }}:${{ steps.version.outputs.tag }}
            ${{ env.BUILDERS_IMAGE }}:stage
          labels: |
            org.opencontainers.image.version=${{ steps.version.outputs.version }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=builders
          cache-to: type=gha,scope=builders,mode=max

      # The demo site (apps/demo, docs/demo-site.md), built for the stage backend. Stage only:
      # promote-production.yml does not re-tag it.
      - name: Build and push demo
        id: demo
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: apps/demo/Dockerfile
          push: true
          provenance: false
          build-args: |
            BACKEND_URL=${{ env.STAGE_URL }}
          tags: |
            ${{ env.DEMO_IMAGE }}:${{ steps.version.outputs.tag }}
            ${{ env.DEMO_IMAGE }}:stage
          labels: |
            org.opencontainers.image.version=${{ steps.version.outputs.version }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=demo
          cache-to: type=gha,scope=demo,mode=max

      # Sign every pushed image by digest (keyless: the certificate names this workflow on main) and attach its SBOM as a signed
      # attestation (BCHAT-018). Both are separate artifacts next to the image, so the image manifest, its labels and the plain-manifest
      # re-tag of promote-production.yml are untouched. deploy.yml verifies the signature before it deploys the digest.
      # Until the repository variable IMAGE_SIGNING_REQUIRED is "true" a failure here only warns (docs/cicd.md, "Image signing").
      - name: Install cosign
        continue-on-error: ${{ vars.IMAGE_SIGNING_REQUIRED != 'true' }}
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Install syft
        id: syft
        continue-on-error: ${{ vars.IMAGE_SIGNING_REQUIRED != 'true' }}
        uses: anchore/sbom-action/download-syft@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3

      - name: Sign images
        continue-on-error: ${{ vars.IMAGE_SIGNING_REQUIRED != 'true' }}
        env:
          BACKEND_DIGEST: ${{ steps.backend.outputs.digest }}
          BUILDERS_DIGEST: ${{ steps.builders.outputs.digest }}
          DEMO_DIGEST: ${{ steps.demo.outputs.digest }}
        run: |
          failed=0
          for spec in "$BACKEND_IMAGE|$BACKEND_DIGEST" "$BUILDERS_IMAGE|$BUILDERS_DIGEST" "$DEMO_IMAGE|$DEMO_DIGEST"; do
            image="${spec%%|*}"; digest="${spec##*|}"
            if [[ ! "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]; then echo "::error::No digest for $image from the build step."; failed=1; continue; fi
            if cosign sign --yes "$image@$digest"; then
              echo "Signed \`$image@$digest\`." >> "$GITHUB_STEP_SUMMARY"
            else
              echo "::error::Signing $image@$digest failed."; failed=1
            fi
          done
          exit "$failed"

      - name: Attach SBOMs
        continue-on-error: ${{ vars.IMAGE_SIGNING_REQUIRED != 'true' }}
        env:
          BACKEND_DIGEST: ${{ steps.backend.outputs.digest }}
          BUILDERS_DIGEST: ${{ steps.builders.outputs.digest }}
          DEMO_DIGEST: ${{ steps.demo.outputs.digest }}
          SYFT: ${{ steps.syft.outputs.cmd }}
        run: |
          failed=0
          for spec in "$BACKEND_IMAGE|$BACKEND_DIGEST" "$BUILDERS_IMAGE|$BUILDERS_DIGEST" "$DEMO_IMAGE|$DEMO_DIGEST"; do
            image="${spec%%|*}"; digest="${spec##*|}"
            if "$SYFT" "$image@$digest" -o spdx-json=sbom.spdx.json && cosign attest --yes --type spdxjson --predicate sbom.spdx.json "$image@$digest"; then
              echo "Attached the SBOM of \`$image@$digest\`." >> "$GITHUB_STEP_SUMMARY"
            else
              echo "::error::Attaching the SBOM of $image@$digest failed."; failed=1
            fi
          done
          exit "$failed"

  deploy:
    needs: build
    uses: ./.github/workflows/deploy.yml
    with:
      environment: Stage
      url: ${{ needs.build.outputs.url }}
      overlay: stage
      namespace: biatec-chat-stage
      tag: ${{ needs.build.outputs.tag }}
    secrets: inherit
