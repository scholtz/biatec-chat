# The cluster has no dynamic provisioner and no default StorageClass, so the StatefulSet claims (base/postgres.yaml,
# base/redis.yaml; they set no storageClassName) are bound to static volumes: hostPath directories on the NVMe drive of
# node sch-g-04. Each PV has no class (like the cluster's other static volumes, e.g. redis-pv), is pre-bound to its
# claim and pinned to the node.
#
# hostPath directories are not chowned by the kubelet (fsGroup does not apply), and Postgres and Redis run as the
# non-root user 999. Once, on the node, before the first deploy (docs/cicd.md "Storage"):
#   mkdir -p /mnt/nvme1/chat-stage/postgres /mnt/nvme1/chat-stage/redis
#   chown 999:999 /mnt/nvme1/chat-stage/postgres /mnt/nvme1/chat-stage/redis
# Retain: deleting a claim never deletes the data on the drive.
apiVersion: v1
kind: PersistentVolume
metadata:
  name: biatec-chat-stage-postgres
  labels: {app.kubernetes.io/name: biatec-chat-postgres, app.kubernetes.io/part-of: biatec-chat}
spec:
  capacity: {storage: 10Gi}
  accessModes: [ReadWriteOnce]
  persistentVolumeReclaimPolicy: Retain
  volumeMode: Filesystem
  claimRef: {namespace: biatec-chat-stage, name: data-biatec-chat-postgres-0}
  hostPath: {path: /mnt/nvme1/chat-stage/postgres, type: DirectoryOrCreate}
  nodeAffinity:
    required:
      nodeSelectorTerms:
        - matchExpressions:
            - {key: kubernetes.io/hostname, operator: In, values: [sch-g-04]}
---
apiVersion: v1
kind: PersistentVolume
metadata:
  name: biatec-chat-stage-redis
  labels: {app.kubernetes.io/name: biatec-chat-redis, app.kubernetes.io/part-of: biatec-chat}
spec:
  capacity: {storage: 1Gi}
  accessModes: [ReadWriteOnce]
  persistentVolumeReclaimPolicy: Retain
  volumeMode: Filesystem
  claimRef: {namespace: biatec-chat-stage, name: data-biatec-chat-redis-0}
  hostPath: {path: /mnt/nvme1/chat-stage/redis, type: DirectoryOrCreate}
  nodeAffinity:
    required:
      nodeSelectorTerms:
        - matchExpressions:
            - {key: kubernetes.io/hostname, operator: In, values: [sch-g-04]}
