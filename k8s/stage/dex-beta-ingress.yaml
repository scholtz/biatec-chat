# /chat on the BiatecDEX beta host (https://beta.dex.biatec.io/chat), routed to the backend Service of this cluster.
# beta.dex.biatec.io is served by ANOTHER cluster (its own ingress controller, the BiatecDEX repo) than stage.chat.biatec.io.
# The DEX ingress there forwards /chat over HTTPS to https://stage.chat.biatec.io (an ExternalName Service) and KEEPS the Host
# header beta.dex.biatec.io; this controller, which receives that request, routes the host to the backend here. Users never
# reach this host name on this cluster directly, so there is no tls block and no cert-manager annotation (the connection from
# the DEX cluster presents the certificate of stage.chat.biatec.io, or the controller's default one, and is not verified yet,
# BiatecDEX#87). A first attempt with an in-cluster ExternalName name in the DEX repo timed out after 5 s because that name
# does not exist in the DEX cluster.
# The backend needs the FULL path (it moves the /chat prefix to its path base, Hosting:Mounts), so the rewrite is the
# identity: a regex path needs a rewrite-target, and the capture group is the whole path. Anchored with $: without it /chatty
# would match as /chat. The optional trailing "/?" only keeps this path string different from the DEX-side
# "/(chat(?:/.*)?)$" (relevant only if the two Ingresses were ever in one cluster). All of /chat is forwarded on purpose: the
# backend answers only the routes the widget uses and 404s the rest.
# k8s/stage/dex-beta-ingress-test/run.sh checks this against a real ingress-nginx.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: biatec-chat-dex-beta
  labels: {app.kubernetes.io/name: biatec-chat-dex-beta, app.kubernetes.io/part-of: biatec-chat}
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /$1
    nginx.ingress.kubernetes.io/proxy-buffering: "off"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "300"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "300"
spec:
  ingressClassName: nginx
  rules:
    - host: beta.dex.biatec.io
      http:
        paths:
          - path: /(chat(?:/.*)?)/?$
            pathType: ImplementationSpecific
            backend:
              service: {name: biatec-chat-backend, port: {name: http}}
