# Builds and tests everything on every pull request. On main it runs as the first stage of deploy-stage.yml
# (workflow_call), so a push to main is tested once and deployed only when this passes. Needs no secrets. See docs/cicd.md.
name: ci

on:
  pull_request:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  backend:
    runs-on: ubuntu-latest
    # Integration tests use the docker-compose dev databases (throwaway CI containers, dev-only password).
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: biatec
          POSTGRES_PASSWORD: biatec-dev-only
          POSTGRES_DB: biatec_chat
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U biatec -d biatec_chat" --health-interval 5s --health-timeout 3s --health-retries 10
      redis:
        image: redis:7
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 3s --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.x
      - name: Test
        run: dotnet test backend/Biatec.Chat.slnx -c Release --logger "trx;LogFileName=results.trx" --results-directory test-results
      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: backend-test-results
          path: test-results

  js:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # The widget and builders import @biatec/chat-protocol from its dist, so it is built first.
      - name: Build chat-protocol
        run: pnpm --filter @biatec/chat-protocol build
      # The widget typecheck also covers playground/dex, which imports @biatec/chat-widget from its dist.
      - name: Build chat-widget
        run: pnpm --filter @biatec/chat-widget build
      - name: Typecheck
        run: |
          pnpm --filter @biatec/chat-widget typecheck
          pnpm --filter builders typecheck
      - name: Test
        run: |
          pnpm --filter @biatec/chat-widget test
          pnpm --filter builders test
          pnpm --filter @biatec/consent-protocol test
          pnpm --filter mock-oidc test
          pnpm --filter @biatec/consent-protocol conformance
          pnpm --filter @biatec/evidence-verifier test
      - name: Build builders
        run: pnpm --filter builders build
      # The demo site (apps/demo) typechecks and builds against the widget's dist; its tests run axe on the page.
      - name: Demo site
        run: |
          pnpm --filter demo build
          pnpm --filter demo test
      # The administrator dashboard (apps/admin, docs/admin-dashboard.md) is built into the backend image.
      - name: Admin dashboard
        run: |
          pnpm --filter @biatec/admin typecheck
          pnpm --filter @biatec/admin test
          pnpm --filter @biatec/admin build

  authenticator:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/biatec_authenticator
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
      # The release build is obfuscated and its debug symbols are split off (BCHAT-008, T-227), signed here with a throwaway key that exists
      # only for this job, so the build itself, and the merged release manifest the hardening test reads, are checked on every change.
      - name: Release build (obfuscated, throwaway signing key)
        run: |
          KEYPASS="$(openssl rand -hex 24)"
          keytool -genkeypair -keystore android/ci-throwaway.jks -alias ci -keyalg RSA -keysize 2048 -validity 2 \
            -storepass "$KEYPASS" -keypass "$KEYPASS" -dname "CN=biatec-ci" >/dev/null 2>&1
          {
            echo "storeFile=ci-throwaway.jks"
            echo "storePassword=$KEYPASS"
            echo "keyAlias=ci"
            echo "keyPassword=$KEYPASS"
          } > android/key.properties
          flutter build apk --release --obfuscate --split-debug-info=build/symbols \
            --dart-define=OIDC_BASE_URL=https://oidc.example
          rm -f android/key.properties android/ci-throwaway.jks
      - name: Hardening checks against the merged release manifest
        run: flutter test test/platform_hardening_test.dart
      - name: Upload debug symbols
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: authenticator-debug-symbols
          path: apps/biatec_authenticator/build/symbols
          retention-days: 30
          if-no-files-found: error

  images:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Every base image is pinned by digest (BCHAT-018); Dependabot proposes the new digests.
      - name: Check Dockerfile base image pins
        run: |
          python3 -c 'import yaml' 2>/dev/null || (sudo apt-get update -qq && sudo apt-get install -y -qq python3-yaml)
          python3 infra/ci/check_dockerfile_pins.py
          python3 infra/ci/check_dockerfile_pins.py --self-test
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build backend image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: backend/Dockerfile
          push: false
          cache-from: type=gha,scope=backend
          cache-to: type=gha,scope=backend,mode=max
      - name: Build builders image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: builders/sidecar/Dockerfile
          push: false
          cache-from: type=gha,scope=builders
          cache-to: type=gha,scope=builders,mode=max
      - name: Build mock OIDC image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: packages/consent-protocol/mock-oidc/Dockerfile
          push: false
          cache-from: type=gha,scope=mock-oidc
          cache-to: type=gha,scope=mock-oidc,mode=max
      - name: Build demo image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: apps/demo/Dockerfile
          push: false
          # Build check only; the stage image is built for the stage backend in deploy-stage.yml.
          build-args: |
            BACKEND_URL=https://backend.invalid
          cache-from: type=gha,scope=demo
          cache-to: type=gha,scope=demo,mode=max
      - name: Render k8s overlays
        run: |
          kubectl kustomize k8s/stage > /dev/null
          kubectl kustomize k8s/main > /dev/null

  # The deploy identity's Role must cover exactly what the overlays and deploy.yml do and grant nothing wider (BCHAT-020, k8s/rbac).
  # Its own job, so a failed image build does not hide RBAC drift. kubectl and jq are on the runner image; PyYAML is installed if missing.
  deploy-rbac:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Check the deploy RBAC
        run: |
          python3 -c 'import yaml' 2>/dev/null || (sudo apt-get update -qq && sudo apt-get install -y -qq python3-yaml)
          python3 k8s/rbac/check_role.py
          python3 k8s/rbac/check_role.py --self-test
          bash k8s/rbac/test-preflight.sh
